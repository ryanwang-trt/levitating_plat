CONFIG_I2C=y

# Sensor subsystem + the in-tree VL53L0X driver. CONFIG_VL53L0X is already
# "default y" once the devicetree node exists (it depends on
# DT_HAS_ST_VL53L0X_ENABLED), but set it explicitly so the dependency is obvious.
CONFIG_SENSOR=y
CONFIG_VL53L0X=y

# The driver reports init/ranging failures through LOG_ERR; without logging
# enabled those are silently dropped, which is painful during bring-up.
CONFIG_LOG=y
