# Tunable parameters for the levitating platform training pipeline.

reward:
  # Core Free Float terms: keep the platform alive, level, and still.
  w_tilt: 5.0        # penalty on |roll| + |pitch|
  w_vz: 2.0          # penalty on |vz|
  w_ang_rate: 1.0    # penalty on |roll_rate| + |pitch_rate|
  w_energy: 0.1      # penalty on sum(action**2)
  alive_bonus: 1.0   # per-step reward for not terminating

  # Optional height-hold term: flip enabled -> true to switch to hybrid mode
  # (Free Float + station keeping) without touching any code.
  height_hold:
    enabled: false
    weight: 10.0
    # target_height: 0.5   # defaults to env.target_height if omitted

# Initial-condition randomization applied in env.reset(). This is what forces
# the policy to LEARN recovery: every episode starts off-nominal (falling/rising,
# tilted, and tumbling) and must pull itself back into a free float. Affects both
# training and eval. Set enabled: false to restore the old perfect-start behavior.
domain_randomization:
  enabled: true
  vz_range: 1.0          # initial vertical speed sampled from [-vz_range, +vz_range] m/s
  tilt_range_deg: 15.0   # initial roll & pitch each sampled from [-tilt, +tilt] degrees
  ang_rate_range: 1.0    # initial roll_rate & pitch_rate each from [-r, +r] rad/s

hardware:
  # Target board: Raspberry Pi 5 (migrated off Jetson).
  # Pin numbers use the BCM GPIO numbering scheme (what pigpio / gpiozero /
  # lgpio expect by default), NOT physical board pin numbers.
  #
  # motor_pins: one BCM GPIO per motor, in motor order [0, 1, 2, 3].
  # On the Pi 5 these four lines all expose hardware PWM, so they map
  # cleanly to four PWM-driven ESCs/motors with no software PWM jitter.
  motor_pins: [12, 13, 18, 19]

  # I2C bus for the IMU / sensors. The Pi 5 exposes user-space I2C on
  # bus 1 (/dev/i2c-1, header pins 3/5 = GPIO2/GPIO3).
  i2c_bus: 1

training:
  total_timesteps: 1000000
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  seed: 0
  save_path: "models/policy_v1"
